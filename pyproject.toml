[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[project]
name = "coffee-machine"
version = "2026.9.1"
requires-python = ">=3.14"
dependencies = [
  "dependency-injector==4.48.3",
  "loguru==0.7.3",
  "pyfiglet==1.0.2",
  "pyinputplus==0.2.12",
  "rich==14.2.0",
]
[tool.setuptools]
package-dir = { "" = "src" }

[project.scripts]
coffee-machine= "coffee_machine.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__"]
reportMissingImports = true                     #"none" or "warning" to downgrade to a warning
reportMissingTypeStubs = false
typeCheckingMode = "basic"
pythonVersion = "3.14"
pythonPlatform = "Linux"
defineConstant = { DEBUG = true }
useLibraryCodeForTypes = true
requires-python = ">=3.14"
dependencies = []


[tool.ruff]
line-length = 79
target-version = "py314"

select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "S",   # flake8-bandit (security)
  "RET", # flake8-return
  "SIM", # flake8-simplify
]
#ignore = ["B008", "B018", "UP004"] # ["E501"]
ignore = ["B008", "S101"]
exclude = [".git", "__pycache__", "dist", ".venv"]

[tool.ruff.lint.pycodestyle]
max-line-length = 79 # Controls the E501 linter rule

[tool.ruff.per-file-ignores]
"src/variables/functions.py" = ["F821"]
"**/__init__.py" = ["F403", "F401"]
[tool.ruff.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
#docstring-code-format = false
#docstring-code-line-length = "dynamic"


[tool.isort]
profile = "black"
line_length = 79
combine_as_imports = true
force_sort_within_sections = true

[dependency-groups]
dev = ["ruff>=0.14.10", "vulture>=2.14"]
